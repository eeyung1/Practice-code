<!DOCTYPE html>
<html lang="en">
<head>
    <title>ASCII Art Web</title>
	<style>
		body {
			background-color: rgb(46, 2, 2);
			color: white;
		}

		h1 {
			color: cyan;
			text-align: center;
		}

		label {
			color: rgb(187, 54, 192);
		}

		button {
			color: rgb(199, 71, 12);
			background-color: rgb(35, 44, 35);
			padding: 10px;
			margin-top: 10px;
			border: none;
		}

		textarea {
			width: 400px;
			height: 120px;
			padding: 10px;
			margin-top: 10px;
		}

		pre {
			background-color: black;
			color: lime;
			padding: 15px;
			margin-top: 20px;
		}

		.container {
			width: 500px;
			margin: auto;
		}

		select {
			padding: 5px;
			margin-top: 10px;
			width: 200px;
		}

		button:hover {
			background-color: darkgreen;
		}

	</style>
</head>

<body>
    <h1><i>ASCII ART WEB</i></h1>

    <div class="container">

	<form action="/ascii-art" method="POST">

		<label>Enter Text</label>

		<br>

		<textarea name="text"></textarea>

		<br>

		<select name="banner">

			<option>standard</option>

			<option>shadow</option>
			<option>thinkertoy</option>

		</select>

		<br>

		<button>Generate</button>

	</form>

    <hr>
	<hr>

    <pre>
    {{.}}  
    </pre>

    </div>
</body>
</html>
